services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: insight-db
    restart: unless-stopped
    # v10.15.1: parallel queries keep their hash tables in /dev/shm; Docker's default 64 MB made a decision run fail
    # with 'could not resize shared memory segment ... to 16777216 bytes' (server, 2026-11-12). Used only on demand.
    shm_size: "1gb"
    environment:
      POSTGRES_USER: ${DB_USER:-insight}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-insight}
      POSTGRES_DB: ${DB_NAME:-insight}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-insight} -d ${DB_NAME:-insight}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insight-network

  backend:
    image: insight-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # The build stamp (issue 0020), exported by ./update from VERSION.
        INSIGHT_VERSION: ${INSIGHT_VERSION:-}
        INSIGHT_COMMIT: ${INSIGHT_COMMIT:-}
        INSIGHT_COMMIT_DATE: ${INSIGHT_COMMIT_DATE:-}
    container_name: insight-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-insight}:${DB_PASSWORD:-insight}@postgres:5432/${DB_NAME:-insight}
      API_PORT: 8000
      # Two API processes (issue 0112 Decided 11): one stuck process can't freeze the reader.
      API_WORKERS: ${API_WORKERS:-2}
      BACKEND_PUBLIC_URL: http://localhost:${BACKEND_PORT:-8000}
      FRONTEND_PUBLIC_URL: http://localhost:${FRONTEND_PORT:-3000}
      INSIGHT_SOURCES_JSON_PATH: /app/insight_core/config/sources.json
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      INSIGHT_LOG_DIR: /app/logs
      # glibc: cap per-thread arenas and keep the trim threshold static, so freed
      # pages actually return to the OS instead of being pinned by fragmentation.
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
    env_file:
      - .env
    volumes:
      - ./backend/insight_core/config:/app/insight_core/config
      - insight_logs:/app/logs
      # The credentials secret key (generated once unless INSIGHT_SECRET_KEY is set in .env),
      # shared by the API and ingestion so both decrypt the same Connections values.
      - insight_secrets:/app/secrets
    command: ["/app/docker/start-backend.sh"]
    # Open files (issue 0124): Docker's default soft limit is 1,024, and after a long hang of both API processes one
    # accepted the queued connections past it and stayed stuck there. The supervisor asks for the same at its start.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # The API answers only this machine (issue 0071): it has no login and can delete sources.
    # The app reaches it through the frontend's nginx on the compose network (/api).
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    # The frontend starts once this passes (depends_on below), so an update's downtime is the API's
    # start (issue 0069): checked every second from the start, then every 30 s. The start period
    # leaves migrations time; a failure in it doesn't count. start_interval: Engine 25+, Compose 2.20.2+.
    # It asks /api/version, what the reader needs (issue 0117): on 5 Nov /health answered while every
    # /api/* request hung. 4 failures in a row (2 minutes) are unhealthy. Docker restarts nothing for
    # that: insight-ingestion's watchdog does (DEPLOYMENT.md, "When the API stops answering").
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "5", "-o", "/dev/null", "http://localhost:8000/api/version"]
      interval: 30s
      timeout: 6s
      retries: 4
      start_period: 120s
      start_interval: 1s
    networks:
      - insight-network

  ingestion:
    image: insight-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # The build stamp (issue 0020), exported by ./update from VERSION.
        INSIGHT_VERSION: ${INSIGHT_VERSION:-}
        INSIGHT_COMMIT: ${INSIGHT_COMMIT:-}
        INSIGHT_COMMIT_DATE: ${INSIGHT_COMMIT_DATE:-}
    container_name: insight-ingestion
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-insight}:${DB_PASSWORD:-insight}@postgres:5432/${DB_NAME:-insight}
      INSIGHT_SOURCES_JSON_PATH: /app/insight_core/config/sources.json
      INSIGHT_INGEST_INTERVAL_HOURS: ${INSIGHT_INGEST_INTERVAL_HOURS:-20}
      INSIGHT_INGEST_TICK_MINUTES: ${INSIGHT_INGEST_TICK_MINUTES:-60}
      INSIGHT_LOG_DIR: /app/logs
      # The API watchdog (issue 0117): asks the API's /api/version every 30 s; after 2 minutes of no answer it asks
      # the API container to restart (a file in the shared logs volume; no Docker socket), 3 times an hour at most.
      INSIGHT_API_WATCHDOG: ${INSIGHT_API_WATCHDOG:-on}
      INSIGHT_API_WATCHDOG_URL: http://backend:8000/api/version
      # glibc: cap per-thread arenas and keep the trim threshold static, so freed
      # pages actually return to the OS instead of being pinned by fragmentation.
      MALLOC_ARENA_MAX: "2"
      MALLOC_TRIM_THRESHOLD_: "131072"
    env_file:
      - .env
    volumes:
      - ./backend/insight_core/config:/app/insight_core/config
      - insight_logs:/app/logs
      # The credentials secret key (generated once unless INSIGHT_SECRET_KEY is set in .env),
      # shared by the API and ingestion so both decrypt the same Connections values.
      - insight_secrets:/app/secrets
    command: ["/app/docker/start-ingestion.sh"]
    # The image's HEALTHCHECK curls localhost:8000/health, which only exists in the API
    # container. Inherited here it can never pass, so this service reported "unhealthy"
    # for its entire life and a real failure was indistinguishable from normal. The
    # scheduler has no port to probe; assert the process is alive instead.
    healthcheck:
      # ps is not in the slim image; /proc always is. PID 1 is tini, so scan all procs.
      test: ["CMD-SHELL", "grep -qa run_scheduler /proc/*/cmdline || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - insight-network

  frontend:
    image: insight-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        # The build stamp (issue 0020), exported by ./update from VERSION.
        INSIGHT_VERSION: ${INSIGHT_VERSION:-}
        INSIGHT_COMMIT: ${INSIGHT_COMMIT:-}
        INSIGHT_COMMIT_DATE: ${INSIGHT_COMMIT_DATE:-}
    container_name: insight-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - insight-network

volumes:
  postgres_data:
    driver: local
  insight_logs:
    driver: local
  insight_secrets:
    driver: local

networks:
  insight-network:
    driver: bridge
