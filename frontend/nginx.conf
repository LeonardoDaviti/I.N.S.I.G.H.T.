# frontend/nginx.conf

# Post images fetched through /api/media (issue 0006): kept 24 hours, then deleted by
# nginx's cache manager (inactive=24h). A cache, not storage: a rebuilt container starts empty.
proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:10m max_size=2g inactive=24h use_temp_path=off;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Post images: the API fetches one when it is first shown, nginx keeps it for a day.
    location ^~ /api/media {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache media;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 24h;
        proxy_cache_valid 404 502 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        proxy_read_timeout 30s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # API proxy (optional - if you want same-origin requests)
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
